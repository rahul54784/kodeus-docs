# ---------------------------------------------------------------------------
# Warren marketing site (warren.kodeus.ai) — copy into THAT site's netlify.toml.
# Replace DOCS_DEPLOY_URL with this docs Netlify URL (no trailing slash), e.g.
# https://magenta-cannoli-ae5215.netlify.app
#
# Place these rules ABOVE any SPA catch-all (/* → /index.html).
#
# Docs build uses absolute asset URLs (assetPrefix = Netlify URL), so you only
# need /docs/* and /api/* here — not /_next/*.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/docs"
  to = "DOCS_DEPLOY_URL/docs/warren/overview"
  status = 200
  force = true

[[redirects]]
  from = "/docs/*"
  to = "DOCS_DEPLOY_URL/docs/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "DOCS_DEPLOY_URL/api/:splat"
  status = 200
  force = true
