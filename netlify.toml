# Docs site (this repo) — Next.js 16 + Fumadocs
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Edge redirect on the docs deploy itself
[[redirects]]
  from = "/docs"
  to = "/docs/warren/overview"
  status = 307

# CORS for assets loaded cross-origin when docs HTML is proxied (e.g. warren.kodeus.ai/docs)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/images/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
